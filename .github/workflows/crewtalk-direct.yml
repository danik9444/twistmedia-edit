name: Build CrewTalk direct preview
on:
  push:
    branches: [crewtalk-preview]
    paths:
      - '.github/workflows/crewtalk-direct.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crewtalk-preview
      - name: Patch verified V5 UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('crewtalk-preview/direct.html')
          s=p.read_text()
          css='@media(max-width:850px){.taskInputV3{margin:0 0 13px}.taskBoxV4 textarea{min-height:105px;max-height:205px;font-size:16px}.todayPicker{padding:13px 11px}.teamTabs{gap:5px!important}.pickerHead{align-items:flex-start}.pickerActions{justify-content:flex-end}}\n'
          css2=css+'.sendTasksArea{display:grid;gap:6px;margin-top:13px;padding-top:13px;border-top:1px solid #edf1ee}.sendTasksBtn{width:100%;min-height:48px;font-size:13px}.sendTasksArea small{text-align:center;color:var(--mut);font-size:9px}\n'
          if '.sendTasksBtn{' not in s:
              s=s.replace(css,css2)
          s=s.replace('oninput="autoSizeTask()"','oninput="autoSizeTask();updateSendTasksState()"')
          old='<div class="workerGridV3" id="recipients"></div></section>'
          new='<div class="workerGridV3" id="recipients"></div><div class="sendTasksArea"><button class="primary sendTasksBtn" id="sendTasksBtn" onclick="startSendFlow()">📤 שלח משימות</button><small>לפני השליחה תוצג בדיקת המשימה, התרגום ו־SafeTranslate.</small></div></section>'
          if 'id="sendTasksBtn"' not in s:
              s=s.replace(old,new)
          vis="function visibleRecipients(){const list=projectWorkers();if(currentTeam==='all')return list;if(currentTeam==='none')return list.filter(w=>!w.team);return list.filter(w=>String(w.team)===String(currentTeam))}\n"
          funcs=vis+"function setTeam(team){currentTeam=String(team);renderRecipients();requestAnimationFrame(()=>document.querySelector('#teamTabs .on')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}))}\nfunction startSendFlow(){analyzeInstruction()}\nfunction updateSendTasksState(){const b=$('sendTasksBtn');if(!b)return;const ready=selected.size>0&&!!$('instruction').value.trim();b.disabled=!ready;b.setAttribute('aria-disabled',String(!ready))}\n"
          if 'function setTeam(team)' not in s:
              s=s.replace(vis,funcs)
          old_tail="$('allBtn').textContent=allSelected?'נקה את הצוות':'בחר את כל הצוות'}"
          new_tail="$('allBtn').textContent=allSelected?'נקה את הצוות':'בחר את כל הצוות';updateSendTasksState()}"
          if old_tail in s:
              s=s.replace(old_tail,new_tail,1)
          old_rec="b.setAttribute('aria-label',recording?'עצור הקלטה':'הקלט משימה')}"
          new_rec="b.setAttribute('aria-label',recording?'עצור הקלטה':'הקלט משימה');updateSendTasksState()}"
          if old_rec in s:
              s=s.replace(old_rec,new_rec,1)
          old_end='renderRecipients();renderWorkers();renderProjects();renderTeams();renderTerms();\n'
          new_end='renderRecipients();renderWorkers();renderProjects();renderTeams();renderTerms();updateSendTasksState();\n'
          if old_end in s:
              s=s.replace(old_end,new_end)
          p.write_text(s)
          data=p.read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          assert len(data)==56228, (len(data),sha)
          assert sha=='476f799d4df3951ea4b0e931f72f8ebef7618944e54de3a6fd0c13b8d77b74e0', sha
          assert 'function setTeam(team)' in s
          assert 'id="sendTasksBtn"' in s
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('crewtalk-preview/direct.html').read_text()
          a=s.index('<script>')+8
          b=s.rindex('</script>')
          Path('/tmp/crewtalk.js').write_text(s[a:b])
          PY
          node --check /tmp/crewtalk.js
      - name: Commit verified V5
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crewtalk-preview/direct.html
          git diff --cached --quiet || git commit -m 'CrewTalk Today V5: teams + send tasks'
          git push
