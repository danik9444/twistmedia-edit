name: Build CrewTalk direct preview
on:
  push:
    branches: [crewtalk-preview]
    paths:
      - '.github/workflows/crewtalk-direct.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crewtalk-preview
      - name: Build exact direct HTML
        run: |
          printf '%s\n' .crewtalk-build/part*.b64 | sort -V | xargs cat > /tmp/crewtalk.b64
          base64 -d /tmp/crewtalk.b64 > crewtalk-preview/direct.html
          echo "2214054904ef4af8d0e3f5d9560bd09341eaac9c3a2d4c77a3299890f6f1589d  crewtalk-preview/direct.html" | sha256sum -c -
          test "$(wc -c < crewtalk-preview/direct.html)" = "55213"
      - name: Commit verified direct HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crewtalk-preview/direct.html
          git diff --cached --quiet || git commit -m 'Build verified CrewTalk direct preview'
          git push
