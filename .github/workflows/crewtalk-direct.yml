name: Build CrewTalk V6 preview
on:
  push:
    branches: [crewtalk-preview]
    paths:
      - '.github/workflows/crewtalk-direct.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crewtalk-preview
      - name: Build exact V6 HTML
        run: |
          cat .crewtalk-v6/part01.b64 .crewtalk-v6/part02_1.b64 .crewtalk-v6/part02_2.b64 .crewtalk-v6/part02_3.b64 .crewtalk-v6/part02_4.b64 .crewtalk-v6/part03.b64 .crewtalk-v6/part04.b64 .crewtalk-v6/part05.b64 | base64 -d | gzip -d > crewtalk-preview/direct.html
          cp crewtalk-preview/direct.html crewtalk-preview/index.html
          echo "3976580be70e096f256dac21f66bc7aa90047398b8c72d15fcec05895955e8a0  crewtalk-preview/direct.html" | sha256sum -c -
          echo "3976580be70e096f256dac21f66bc7aa90047398b8c72d15fcec05895955e8a0  crewtalk-preview/index.html" | sha256sum -c -
          test "$(wc -c < crewtalk-preview/direct.html)" = "35812"
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('crewtalk-preview/direct.html').read_text()
          a=s.index('<script>')+8
          b=s.rindex('</script>')
          Path('/tmp/crewtalk.js').write_text(s[a:b])
          PY
          node --check /tmp/crewtalk.js
      - name: Commit verified V6
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crewtalk-preview/direct.html crewtalk-preview/index.html
          git diff --cached --quiet || git commit -m 'CrewTalk Today V6 task editor'
          git pull --rebase origin crewtalk-preview
          git push origin crewtalk-preview
