name: Build CrewTalk direct preview
on:
  push:
    branches: [crewtalk-preview]
    paths:
      - 'crewtalk-preview/index.html'
      - '.github/workflows/crewtalk-direct.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crewtalk-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand preview wrapper
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const src = fs.readFileSync('crewtalk-preview/index.html','utf8');
          const m = src.match(/H4sI[A-Za-z0-9+/=]+/);
          if (!m) throw new Error('gzip bundle not found');
          const html = zlib.gunzipSync(Buffer.from(m[0], 'base64')).toString('utf8');
          if (!html.includes('<title>CrewTalk')) throw new Error('unexpected preview');
          fs.writeFileSync('crewtalk-preview/direct.html', html);
          NODE
      - name: Commit direct HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crewtalk-preview/direct.html
          git diff --cached --quiet || git commit -m 'Build CrewTalk direct preview'
          git push
